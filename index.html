<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="가계부 테스트">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#334155">
<title>가계부 테스트</title>
<style>
:root{--bg:#eceaf3;--card:#fff;--text:#1f2937;--sub:#6b7280;--line:#e5e7eb;--soft:#f3f2f8;--ink:#334155;--btn:#334155;--btn-t:#fff;--inc:#0f9f6e;--warn:#f59e0b;--bad:#e5484d;--sh:0 6px 24px rgba(51,65,85,.08);--r:20px;--heat:51,65,85;--heat-t:#fff;--note-bg:#fff7e6;--note-t:#8a5a00;--err-bg:#fdecec;--err-t:#b42318}
html[data-theme=dark]{--bg:#121318;--card:#1d1f27;--text:#e8eaf0;--sub:#9aa1ae;--line:#2d303a;--soft:#262833;--ink:#e2e8f0;--btn:#475569;--btn-t:#fff;--inc:#34d399;--sh:0 6px 24px rgba(0,0,0,.35);--heat:148,163,184;--heat-t:#111;--note-bg:rgba(245,158,11,.14);--note-t:#fbbf24;--err-bg:rgba(229,72,77,.16);--err-t:#ff8a8d}
@media (prefers-color-scheme:dark){html:not([data-theme=light]){--bg:#121318;--card:#1d1f27;--text:#e8eaf0;--sub:#9aa1ae;--line:#2d303a;--soft:#262833;--ink:#e2e8f0;--btn:#475569;--btn-t:#fff;--inc:#34d399;--sh:0 6px 24px rgba(0,0,0,.35);--heat:148,163,184;--heat-t:#111;--note-bg:rgba(245,158,11,.14);--note-t:#fbbf24;--err-bg:rgba(229,72,77,.16);--err-t:#ff8a8d}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:18px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
body{padding-bottom:calc(100px + env(safe-area-inset-bottom))}
#app{max-width:560px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 16px 16px}
h2{font-size:19px;margin:0 0 12px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:18px;margin-bottom:14px}
.btn{min-height:52px;border:0;border-radius:16px;background:var(--btn);color:var(--btn-t);font:inherit;font-weight:600;padding:0 18px;cursor:pointer;width:100%}
.btn.ghost{background:var(--soft);color:var(--text)}
.btn.danger{background:var(--bad);color:#fff}
.btn.sm{min-height:42px;width:auto;font-size:15px;padding:0 14px;border-radius:12px}
input,select,textarea{font:inherit;color:var(--text);background:var(--soft);border:1.5px solid transparent;border-radius:14px;min-height:52px;padding:10px 14px;width:100%;outline:none;-webkit-appearance:none;appearance:none}
input:focus,select:focus,textarea:focus{border-color:var(--ink)}
input[type=radio]{width:22px;height:22px;min-height:0;padding:0;-webkit-appearance:radio;appearance:auto;accent-color:var(--btn)}
textarea{min-height:180px;resize:vertical;line-height:1.45}
label.f{display:block;font-size:15px;color:var(--sub);margin:14px 0 6px}
.radio{display:flex;align-items:center;gap:10px;min-height:48px;cursor:pointer}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:6px 14px;font:inherit;font-size:16px;min-height:42px;cursor:pointer}
.chip.on{background:var(--btn);color:#fff;border-color:var(--btn)}
.catgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.catgrid .chip{border-radius:14px;padding:8px 2px;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.2}
.amt{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.amtin{font-size:26px;font-weight:800}
.big{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.sub{color:var(--sub);font-size:15px}
.inc{color:var(--inc)}
.neg{color:var(--bad)}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border-bottom:0}
.ico{width:46px;height:46px;border-radius:14px;background:var(--soft);display:grid;place-items:center;font-size:22px;flex:none}
.mid{flex:1;min-width:0}
.name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.mini{background:var(--soft);border-radius:16px;padding:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bar{height:12px;border-radius:99px;background:var(--soft);overflow:hidden;margin:8px 0 4px}
.bar>i{display:block;height:100%;background:var(--btn);border-radius:99px}
.bar.warn>i{background:var(--warn)}
.bar.over>i{background:var(--bad)}
.stack{display:flex;height:18px;border-radius:99px;overflow:hidden;background:var(--soft);margin-bottom:10px}
.stack>i{display:block;height:100%}
.dot{width:12px;height:12px;border-radius:50%;flex:none;display:inline-block}
.top{display:flex;align-items:center;justify-content:space-between;margin:4px 0 14px;gap:8px}
.top h1{font-size:22px;margin:0;white-space:nowrap}
.mnav{display:flex;align-items:center;gap:8px;font-size:17px;white-space:nowrap}
.mnav button{width:44px;height:44px;border-radius:50%;border:0;background:var(--card);box-shadow:var(--sh);font-size:24px;color:var(--text);cursor:pointer;line-height:1}
.seg{display:flex;background:var(--soft);border-radius:14px;padding:4px}
.seg button{flex:1;min-height:44px;border:0;background:none;border-radius:11px;font:inherit;color:var(--sub);cursor:pointer}
.seg button.on{background:var(--card);color:var(--text);font-weight:700;box-shadow:var(--sh)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{text-align:center;font-size:13px;color:var(--sub)}
.cal .d{aspect-ratio:1/1.2;border-radius:12px;padding:4px 3px;font:inherit;font-size:14px;display:flex;flex-direction:column;justify-content:space-between;align-items:center;background:var(--soft);border:2px solid transparent;color:var(--text);cursor:pointer}
.cal .d small{font-size:11px;font-weight:700;white-space:nowrap}
.cal .d.hot{color:var(--heat-t)}
.cal .d.sel{border-color:var(--ink)}
.cal .d.today span{font-weight:800;text-decoration:underline}
.notice{background:var(--note-bg);color:var(--note-t);border-radius:14px;padding:12px 14px;font-size:15px;margin-bottom:10px;white-space:pre-line}
.notice.err{background:var(--err-bg);color:var(--err-t)}
.raw{white-space:pre-wrap;font-size:14px;background:var(--soft);border-radius:12px;padding:10px 12px;margin-bottom:10px;color:var(--sub);word-break:break-all}
.photo{width:100%;max-height:220px;object-fit:contain;border-radius:16px;background:#000;cursor:zoom-in;display:block;margin-bottom:6px}
.addgrid .btn{min-height:84px;font-size:16px;background:var(--card);color:var(--text);box-shadow:var(--sh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1.25}
.addgrid .btn span{font-size:30px}
.tag{display:inline-flex;align-items:center;gap:4px;background:var(--soft);border-radius:999px;padding:4px 6px 4px 12px;margin:0 6px 8px 0;font-size:15px}
.tag button{border:0;background:none;color:var(--sub);font-size:16px;min-width:32px;min-height:32px;cursor:pointer}
.lrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:16px}
.lrow:last-child{border-bottom:0}
#tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);box-shadow:0 -4px 20px rgba(0,0,0,.07);padding-bottom:env(safe-area-inset-bottom);z-index:20}
#tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:72px}
#tabs button{background:none;border:0;font:inherit;font-size:13px;color:var(--sub);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer}
#tabs button span{font-size:24px;line-height:1.1}
#tabs button.on{color:var(--ink);font-weight:700}
#tabs .plus{width:66px;height:66px;border-radius:50%;background:var(--btn);color:#fff;font-size:38px;margin-top:-26px;box-shadow:0 8px 20px rgba(51,65,85,.35);display:grid;place-items:center;line-height:1}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:50;display:none}
.overlay.show{display:flex}
#sheetWrap{align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;max-height:92dvh;overflow:auto;-webkit-overflow-scrolling:touch;border-radius:24px 24px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom));animation:up .22s ease}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 12px}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
#zoom{align-items:center;justify-content:center;background:rgba(0,0,0,.92);z-index:70}
#zoom img{max-width:100%;max-height:100%}
#loading{z-index:80;flex-direction:column;align-items:center;justify-content:center;color:#fff;gap:14px;text-align:center;padding:20px}
.spinner{width:50px;height:50px;border:5px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#lock{position:fixed;inset:0;background:var(--bg);z-index:90;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px}
.dots{display:flex;gap:16px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink)}
.dots i.on{background:var(--ink)}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px}
.pad button{height:76px;border-radius:50%;border:0;background:var(--card);box-shadow:var(--sh);font:inherit;font-size:26px;color:var(--text);cursor:pointer}
#toast{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1f2937;color:#fff;padding:12px 18px;border-radius:14px;font-size:16px;z-index:100;opacity:0;transition:opacity .25s;pointer-events:none;width:max-content;max-width:90vw;text-align:center;white-space:pre-line}
#toast.show{opacity:1}
</style>
</head>
<body>
<div id="app"><main id="view"></main></div>

<nav id="tabs"><div class="in">
  <button data-act="tab" data-tab="home"><span>🏠</span>홈</button>
  <button data-act="tab" data-tab="list"><span>📋</span>내역</button>
  <button data-act="plus" aria-label="내역 추가"><div class="plus">＋</div></button>
  <button data-act="tab" data-tab="stats"><span>📊</span>통계</button>
  <button data-act="tab" data-tab="settings"><span>⚙️</span>설정</button>
</div></nav>

<div id="sheetWrap" class="overlay"><div class="sheet" id="sheet"></div></div>
<div id="zoom" class="overlay" data-act="zoom-close"><img alt="확대한 사진"></div>
<div id="loading" class="overlay"><div class="spinner"></div><p id="loadingMsg"></p></div>
<div id="lock"></div>
<div id="toast" role="status"></div>

<input type="file" id="fCam" accept="image/*" capture="environment" hidden>
<input type="file" id="fPick" accept="image/*" multiple hidden>
<input type="file" id="fCsv" accept=".csv,text/csv" hidden>
<input type="file" id="fJson" accept=".json,application/json" hidden>

<script>
'use strict';
// ===== 기본 도우미 =====
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const won = n => (n == null || n === '' || isNaN(n)) ? '' : Math.round(n).toLocaleString('ko-KR');
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
const dayDiff = (a, b) => Math.round((parseYmd(a) - parseYmd(b)) / 86400000);
const WD = ['일', '월', '화', '수', '목', '금', '토'];
const fmtDate = s => { const d = parseYmd(s); return `${d.getMonth() + 1}월 ${d.getDate()}일 (${WD[d.getDay()]})`; };
const ym = s => s.slice(0, 7);
const shiftMonth = (m, n) => { const [y, mm] = m.split('-').map(Number); const d = new Date(y, mm - 1 + n, 1); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };
const monthLabel = m => { const [y, mm] = m.split('-').map(Number); return `${y}년 ${mm}월`; };
const daysInMonth = m => { const [y, mm] = m.split('-').map(Number); return new Date(y, mm, 0).getDate(); };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const shortWon = n => n >= 10000 ? (Math.round(n / 1000) / 10).toString().replace(/\.0$/, '') + '만' : n >= 1000 ? Math.round(n / 1000) + '천' : String(n);
const byDate = (a, b) => b.date.localeCompare(a.date) || (b.createdAt || 0) - (a.createdAt || 0);
function validDate(s) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(s || '')) return false;
  const d = parseYmd(s);
  return d.getFullYear() === +s.slice(0, 4) && d.getMonth() + 1 === +s.slice(5, 7) && d.getDate() === +s.slice(8, 10);
}
// 연도 없는 날짜: 올해, 미래면 작년
function noYear(mo, d) {
  const y = new Date().getFullYear();
  let s = `${y}-${pad(mo)}-${pad(d)}`;
  if (!validDate(s)) return null;
  if (s > today()) s = `${y - 1}-${pad(mo)}-${pad(d)}`;
  return s;
}
// 받침에 맞는 조사
function josa(word, withB, withoutB) {
  const ch = String(word || '').slice(-1), code = ch.charCodeAt(0) - 0xAC00;
  if (code < 0 || code > 11171) return withB === '으로' ? '(으)로' : `${withB}(${withoutB})`;
  const jong = code % 28;
  if (withB === '으로') return (jong === 0 || jong === 8) ? '로' : '으로';
  return jong ? withB : withoutB;
}
class UErr extends Error {}
const errMsg = e => e instanceof UErr ? e.message : '알 수 없는 오류가 났어요.';

// ===== 데이터 =====
const DEF_EXP = [['🍚', '식비'], ['☕', '카페·간식'], ['🚌', '교통'], ['🛍️', '쇼핑'], ['💄', '패션·미용'], ['🛒', '생활·마트'], ['🏠', '주거·통신'], ['💊', '의료·건강'], ['🎬', '문화·여가'], ['📚', '교육·도서'], ['🎁', '경조사·선물'], ['📦', '기타']];
const DEF_INC = [['💰', '급여'], ['🎈', '용돈'], ['➕', '기타수입']];
const PAYS = ['카드', '현금', '계좌이체', '간편결제'];
const COLORS = ['#6366f1', '#0ea5e9', '#14b8a6', '#22c55e', '#eab308', '#f97316', '#ef4444', '#ec4899', '#a855f7', '#84cc16', '#06b6d4', '#94a3b8'];
const TESS = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';

function freshData() {
  return { tx: [], cats: { expense: DEF_EXP.map(([e, n]) => ({ e, n })), income: DEF_INC.map(([e, n]) => ({ e, n })) }, budget: { total: 0, cats: {} }, fixed: [], learn: {}, ignored: [] };
}
function loadJSON(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }
let D = Object.assign(freshData(), loadJSON('gbt_data') || {});
let S = Object.assign({ theme: 'auto', ocr: 'gemini', geminiKey: '', geminiModel: 'gemini-3.5-flash', claudeKey: '', claudeModel: 'claude-haiku-5-5', pinHash: '' }, loadJSON('gbt_settings') || {});

function saveS() {
  try { localStorage.setItem('gbt_settings', JSON.stringify(S)); }
  catch { toast('설정을 저장하지 못했어요. 저장 공간을 확인해 주세요.'); }
}
// 저장 공간이 부족하면 오래된 영수증 썸네일부터 지우고 다시 저장
function saveD() {
  let removed = 0;
  for (;;) {
    try {
      localStorage.setItem('gbt_data', JSON.stringify(D));
      if (removed) setTimeout(() => toast(`저장 공간이 부족해 오래된 영수증 사진 ${removed}장을 지웠어요`), 2500);
      return true;
    } catch (e) {
      const withThumb = D.tx.filter(t => t.thumb).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
      if (!withThumb.length) { toast('저장 공간이 가득 찼어요. 백업한 뒤 오래된 내역을 지워 주세요.'); return false; }
      withThumb.slice(0, Math.max(1, Math.ceil(withThumb.length * 0.2))).forEach(t => { delete t.thumb; removed++; });
    }
  }
}

const catList = type => D.cats[type] || [];
const catNames = type => catList(type).map(c => c.n);
function catEmoji(n) {
  for (const t of ['expense', 'income']) { const c = catList(t).find(c => c.n === n); if (c) return c.e; }
  return '📦';
}
function fallbackCat(type) {
  const l = catNames(type), def = type === 'income' ? '기타수입' : '기타';
  return l.includes(def) ? def : (l[l.length - 1] || def);
}
const txOf = m => D.tx.filter(t => t.date.startsWith(m));
const sum = (arr, type) => arr.reduce((s, t) => s + (t.type === type ? t.amount || 0 : 0), 0);
function groupSum(arr, keyFn) {
  const g = {};
  arr.forEach(t => { const k = keyFn(t); g[k] = (g[k] || 0) + (t.amount || 0); });
  return Object.entries(g).sort((a, b) => b[1] - a[1]);
}

// ===== 가맹점 분류 =====
const KW = [
  ['문화·여가', /메가박스|CGV|롯데시네마|넷플릭스|NETFLIX|유튜브|YOUTUBE|멜론|스포티파이|SPOTIFY|왓챠|티빙|웨이브|디즈니|영화|공연|노래방|PC방|피씨방|야놀자|여기어때|호텔|숙박|게임|볼링|에버랜드|롯데월드/i],
  ['패션·미용', /무신사|지그재그|에이블리|29CM|올리브영|미용실|헤어|네일|유니클로|ZARA|자라|H&M|탑텐|스파오|화장품|뷰티|이니스프리/i],

  if (!amount) {
    const all = (text.match(/\d{1,3}(?:,\d{3})+/g) || []).map(s => parseInt(s.replace(/,/g, ''), 10)).filter(n => n < 10000000);
    if (all.length) amount = Math.max(...all);
  }
  const payment = /현금/.test(text) ? '현금' : /페이|pay/i.test(text) ? '간편결제' : '카드';
  const cat = guessCat(merchant, 'expense', lines.slice(0, 3).join(' '));
  return { type: 'expense', merchant, date, amount: amount || null, cat, autoCat: cat, payment, memo: '' };
}
function parseAIJson(text) {
  const s = String(text || '').replace(/```(?:json)?/gi, '');
  const a = s.indexOf('{'), b = s.lastIndexOf('}');
  if (a < 0 || b <= a) throw new UErr('AI 응답에서 결과를 찾지 못했어요.');
  try { return JSON.parse(s.slice(a, b + 1)); } catch { throw new UErr('AI 응답을 해석하지 못했어요.'); }
}
function normalizeAI(j) {
  const type = j.type === 'income' ? 'income' : 'expense';
  const merchant = j.merchant ? String(j.merchant).trim().slice(0, 40) : '';
  let amount = j.amount == null ? null : parseInt(String(j.amount).replace(/[^\d]/g, ''), 10);
  if (!amount) amount = null;
  const date = validDate(j.date) ? j.date : today();
  const items = Array.isArray(j.items) ? j.items.slice(0, 8).map(x => typeof x === 'string' ? x : (x && (x.name || x.item)) || '').filter(Boolean).map(String) : [];
  const names = catNames(type), learned = D.learn[normM(merchant)];
  let cat = learned && names.includes(learned) ? learned : names.includes(j.category) ? j.category : guessCat(merchant, type, items.join(' '));

  return { type, merchant, amount, date, cat, autoCat: cat, payment, memo, notes, hasDate: validDate(j.date) };
}

// ===== 반복결제 감지·고정지출 =====
function detectRecurring() {
  const curM = ym(today()), from = shiftMonth(curM, -5) + '-01';
  const fixedKeys = new Set(D.fixed.map(f => normM(f.name)));
  const g = {};
  D.tx.filter(t => t.type === 'expense' && t.date >= from && t.merchant && t.source !== 'recurring').forEach(t => {
    const k = normM(t.merchant);
    if (!k || fixedKeys.has(k) || D.ignored.includes(k)) return;
    (g[k] = g[k] || []).push(t);
  });
  const out = [];
  for (const [k, arr] of Object.entries(g)) {
    const byM = {};
    arr.forEach(t => (byM[ym(t.date)] = byM[ym(t.date)] || []).push(t));
    const months = Object.keys(byM).sort();
    const run = [];
    for (let i = months.length - 1; i >= 0; i--) {
      const m = months[i];
      if (byM[m].length !== 1) break;
      if (run.length && shiftMonth(m, 1) !== run[0]) break;
      run.unshift(m);
    }
    if (run.length < 2 || run[run.length - 1] < shiftMonth(curM, -1)) continue;
    const ts = run.map(m => byM[m][0]), amts = ts.map(t => t.amount), days = ts.map(t => +t.date.slice(8));
    const r1 = run.length >= 3 && Math.max(...amts) <= Math.min(...amts) * 1.1 && Math.max(...days) - Math.min(...days) <= 6;
    const r2 = amts[amts.length - 1] === amts[amts.length - 2];
    if (r1 || r2) {
      const l = ts[ts.length - 1];
      out.push({ k, name: l.merchant, amount: l.amount, day: +l.date.slice(8), cat: l.cat, payment: l.payment, lastMonth: ym(l.date) });
    }
  }
  return out.sort((a, b) => b.amount - a.amount).slice(0, 3);
}
// 앱을 열 때 지난 결제일의 고정지출을 밀린 달까지 기록
function runFixed() {
  const now = today(), curM = ym(now);
  let n = 0;
  for (const f of D.fixed) {
    f.done = f.done || [];
    for (let m = f.start || curM; m <= curM; m = shiftMonth(m, 1)) {
      const ds = `${m}-${pad(Math.min(f.day, daysInMonth(m)))}`;
      if (ds > now || f.done.includes(m)) continue;
      D.tx.push({ id: uid(), type: 'expense', date: ds, merchant: f.name, amount: f.amount, cat: f.cat, payment: f.payment || '카드', memo: '고정지출 자동 기록', source: 'recurring', fixedId: f.id, createdAt: Date.now() });
      f.done.push(m);
      n++;
    }
  }
  return n;
}

function aiProvider() {
  if (S.ocr === 'gemini' && S.geminiKey) return 'gemini';
  if (S.ocr === 'claude' && S.claudeKey) return 'claude';
  if (S.geminiKey) return 'gemini';
  if (S.claudeKey) return 'claude';
  return null;
}
function smsPrompt(text) {
  return `한국어 카드·은행 문자 판독기입니다. JSON 객체 하나만 출력: {type(expense|income), merchant, date(YYYY-MM-DD), amount(최종 결제·입출금 금액, 숫자만), category(앱의 카테고리 이름 중 하나), payment(카드|현금|계좌이체|간편결제)}. 날짜가 없으면 오늘 날짜, 읽을 수 없는 값은 null.\n지출 카테고리: ${catNames('expense').join(', ')}\n수입 카테고리: ${catNames('income').join(', ')}\n오늘 날짜: ${today()}\n\n문자:\n${text}`;
}
async function readSms() {
  const parts = splitSms($('#smsText')?.value);
  if (!parts.length) return toast('문자를 붙여넣어 주세요');
  const drafts = [], prov = aiProvider();
  let skipped = 0, noMatch = 0;
  for (let i = 0; i < parts.length; i++) {
    const r = parseSmsOne(parts[i]);
    if (r.skip) { skipped++; continue; }
    if (r.kind === 'cancel') { r.match = findCancelMatch(r); if (r.match) drafts.push(r); else noMatch++; continue; }
    if (r.amount == null && !r.fx && prov) {
      showLoading(`AI로 다시 읽는 중… (${i + 1}/${parts.length})`);
      try {
        const j = parseAIJson(await aiCall(prov, smsPrompt(redact(parts[i]))));
        const n = normalizeAI(j);
        Object.assign(r, { type: n.type, merchant: n.merchant || r.merchant, amount: n.amount, date: n.hasDate ? n.date : r.date, cat: n.cat, autoCat: n.cat, payment: n.payment });
        r.notes = [{ t: '규칙으로 못 읽어서 AI가 읽은 결과예요. 꼭 확인해 주세요.' }];
      } catch (e) { r.notes = [{ err: 1, t: 'AI로도 읽지 못했어요: ' + errMsg(e) }]; }
      hideLoading();
    }
    if (r.amount == null && !r.notes) r.notes = [{ t: r.fx ? '외화 결제예요. 원화 금액을 직접 입력해 주세요 (메모에 외화 금액을 남겼어요).' : '금액을 읽지 못했어요. 직접 입력해 주세요.' }];
    drafts.push(r);
  }
  toast(`${drafts.length}건을 읽었어요${skipped ? ` · 건너뜀 ${skipped}건` : ''}${noMatch ? `\n맞는 내역이 없는 취소 문자 ${noMatch}건은 그냥 넘어갔어요` : ''}`);
  if (!drafts.length) return;
  Q = drafts;
  processQueue();
}

// ----- 영수증 인식 -----
function loadImg(file) {
  return new Promise((ok, no) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); ok(img); };
    img.onerror = () => { URL.revokeObjectURL(url); no(new Error('img')); };
    img.src = url;
  });
}
function toJpeg(img, max, q) {
  const w = img.naturalWidth, h = img.naturalHeight, s = Math.min(1, max / Math.max(w, h));
  const c = document.createElement('canvas');
  c.width = Math.round(w * s); c.height = Math.round(h * s);
  const x = c.getContext('2d');

  'cancel-apply': el => { D.tx = D.tx.filter(t => t.id !== el.dataset.id); saveD(); toast('취소 문자와 맞는 내역을 지웠어요'); nextInQueue(); },
  theme: el => { S.theme = el.dataset.v; saveS(); applyTheme(); renderSettings(); },
  ocr: el => { S.ocr = el.dataset.v; saveS(); renderSettings(); },
  'ai-test': () => testAI(),
  'fixed-add': () => {
    const name = $('#fxName').value.trim(), amount = parseInt($('#fxAmt').value.replace(/[^\d]/g, ''), 10), day = parseInt($('#fxDay').value, 10);
    if (!name) return toast('이름을 입력해 주세요');
    if (!amount) return toast('금액을 입력해 주세요');
    if (!(day >= 1 && day <= 31)) return toast('결제일은 1~31 사이 숫자로 입력해 주세요');
    D.fixed.push({ id: uid(), name, amount, day, cat: $('#fxCat').value, payment: $('#fxPay').value, start: ym(today()), done: [] });
    const n = runFixed();
    saveD(); toast(`고정지출을 등록했어요${n ? `\n이번 달 결제일이 지나서 ${n}건을 바로 기록했어요` : ''}`); renderSettings();
  },
  'fixed-del': el => { if (!confirm('이 고정지출을 삭제할까요?\n(이미 기록된 내역은 남아요)')) return; D.fixed = D.fixed.filter(f => f.id !== el.dataset.id); saveD(); renderSettings(); },
  'cat-add': () => {
    const type = $('#caType').value, name = $('#caName').value.trim(), e = $('#caEmoji').value.trim() || '🏷️';
    if (!name) return toast('카테고리 이름을 입력해 주세요');
    if (catNames(type).includes(name)) return toast('이미 있는 카테고리예요');
    D.cats[type].push({ e, n: name }); saveD(); toast('카테고리를 추가했어요'); renderSettings();
  },
  'cat-del': el => {
    const type = el.dataset.type, n = el.dataset.n;
    if (catList(type).length <= 1) return toast('카테고리는 하나 이상 있어야 해요');
    if (!confirm(`'${n}' 카테고리를 삭제할까요?\n이미 기록된 내역은 그대로 남아요.`)) return;
    D.cats[type] = catList(type).filter(c => c.n !== n);
    delete D.budget.cats[n];
    saveD(); renderSettings();
  },
  'learn-del': el => { delete D.learn[el.dataset.k]; saveD(); renderSettings(); },
  'ign-undo': el => { D.ignored = D.ignored.filter(k => k !== el.dataset.k); saveD(); renderSettings(); },
  'pin-set': () => { if (!(window.crypto && crypto.subtle)) return toast('PIN 잠금은 https 주소에서만 쓸 수 있어요'); showLock('set1'); },
  'pin-off': () => { if (!confirm('PIN 잠금을 끌까요?')) return; S.pinHash = ''; saveS(); renderSettings(); },
  'pin-cancel': () => hideLock(),
  pin: el => pinKey(el.dataset.k),
  'pin-forgot': () => {
    if (!confirm('PIN을 잊었다면 모든 데이터를 지우고 초기화해야 해요. 계속할까요?')) return;
    if (!confirm('정말 모든 내역을 지울까요? 되돌릴 수 없어요.')) return;
    localStorage.removeItem('gbt_data'); S.pinHash = ''; saveS(); location.reload();
  },
  'csv-out': () => exportCSV(),
  'csv-in': () => $('#fCsv').click(),
  'json-out': () => exportJSON(),
  'json-in': () => $('#fJson').click(),
  'sample-add': () => addSample(),
  'sample-del': () => { const n = D.tx.filter(t => t.sample).length; if (!n) return toast('샘플 데이터가 없어요'); D.tx = D.tx.filter(t => !t.sample); saveD(); toast(`샘플 ${n}건을 지웠어요`); render(); },
  wipe: () => {
    if (!confirm('모든 데이터를 지울까요?')) return;
    if (!confirm('정말 지울까요? 되돌릴 수 없어요.')) return;
    D = freshData(); saveD(); toast('모든 데이터를 지웠어요'); render();
  },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const f = A[el.dataset.act];
  if (f) f(el, e);
});
$('#sheetWrap').addEventListener('click', e => {
  if (e.target !== e.currentTarget) return;
  if (Q.length && !confirm(`남은 ${Q.length}건 처리를 그만둘까요?`)) return;
  closeSheet(); render();
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'q') { q = el.value; renderListBody(); return; }
  if (!F) return;
  if (el.id === 'fAmt') { const d = el.value.replace(/[^\d]/g, ''); F.amount = d ? parseInt(d, 10) : null; el.value = d ? won(F.amount) : ''; }
  else if (el.id === 'fMer') {
    F.merchant = el.value;
    F.autoCat = guessCat(F.merchant, F.type, F.memo);
    if (!F.catTouched) { F.cat = F.autoCat; $('#fCats').innerHTML = catChips(); }
  }
  else if (el.id === 'fDate') F.date = el.value;
  else if (el.id === 'fMemo') F.memo = el.value;
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.s) { S[el.dataset.s] = el.value.trim(); saveS(); return; }
  if (el.dataset.budget) {
    const v = parseInt(el.value.replace(/[^\d]/g, ''), 10) || 0;
    if (el.dataset.budget === '__total') D.budget.total = v; else if (v) D.budget.cats[el.dataset.budget] = v; else delete D.budget.cats[el.dataset.budget];
    el.value = v ? won(v) : '';
    saveD(); toast('예산을 저장했어요');
  }
});
document.addEventListener('keydown', e => {
  if (e.target.id === 'quick' && e.key === 'Enter' && !e.isComposing) { e.preventDefault(); quickGo(); }
});
$('#fCam').onchange = $('#fPick').onchange = e => {
  const files = [...e.target.files];
  e.target.value = '';
  if (!files.length) return;
  Q = files.map((file, i) => ({ kind: 'photo', file, idx: i + 1, total: files.length }));
  processQueue();
};
$('#fCsv').onchange = async e => { const f = e.target.files[0]; e.target.value = ''; if (f) importCSV(await readFile(f, true)); };
$('#fJson').onchange = async e => { const f = e.target.files[0]; e.target.value = ''; if (f) importJSON(await readFile(f, false)); };

// ----- 홈 화면 설치용 아이콘·manifest -----
function makeIcon(size) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const x = c.getContext('2d');
  x.fillStyle = '#334155'; x.fillRect(0, 0, size, size);
  x.fillStyle = '#eceaf3';
  const r = size * 0.14, bx = size * 0.2, by = size * 0.22, bw = size * 0.6, bh = size * 0.56;
  x.beginPath(); x.moveTo(bx + r, by); x.arcTo(bx + bw, by, bx + bw, by + bh, r); x.arcTo(bx + bw, by + bh, bx, by + bh, r); x.arcTo(bx, by + bh, bx, by, r); x.arcTo(bx, by, bx + bw, by, r); x.fill();
  x.fillStyle = '#334155'; x.font = `800 ${size * 0.34}px -apple-system, sans-serif`; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText('₩', size / 2, size * 0.515);
  return c.toDataURL('image/png');
}
(function setupPWA() {
  const add = (rel, href) => { const l = document.createElement('link'); l.rel = rel; l.href = href; document.head.appendChild(l); };
  add('apple-touch-icon', makeIcon(180));
  add('icon', makeIcon(64));
  if (location.protocol === 'https:') {
    const start = location.origin + location.pathname;
    const man = { name: '가계부 테스트', short_name: '가계부', start_url: start, scope: start.replace(/[^/]*$/, ''), display: 'standalone', background_color: '#eceaf3', theme_color: '#334155', icons: [{ src: makeIcon(192), sizes: '192x192', type: 'image/png' }, { src: makeIcon(512), sizes: '512x512', type: 'image/png' }] };
    add('manifest', 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(man)));
  }
})();

// ----- 시작 -----
applyTheme();
if (S.pinHash) showLock('unlock');
const fixedN = runFixed();
if (fixedN) { saveD(); toast(`고정지출 ${fixedN}건을 자동으로 기록했어요`); }
render();
</script>
